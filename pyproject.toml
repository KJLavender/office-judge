[project]
name = "office-judge"
version = "0.1.0"
description = "Ticket routing, DLP and action-item extraction on top of a System One judge cascade"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
eval = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/judge_core", "src/office_judge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
